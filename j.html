<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
  // Ancienne adresse (GitHub Pages, partagée par les builds jusqu'à la 18) : même page sur le nouveau site.
  if (location.hostname.slice(-9) === 'github.io') location.replace('https://playdibs.vercel.app' + location.pathname.replace(/^\/dibs-site/, '').replace(/\.html$/, '') + location.search);
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're invited | Dibs</title>
<meta name="description" content="A friend invited you to a game of Dibs. Join with the code.">
<meta name="robots" content="noindex">
<meta property="og:title" content="You're invited to a game of Dibs">
<meta property="og:description" content="Call dibs on your friends. Tap to join the game.">
<meta property="og:image" content="https://playdibs.vercel.app/img/icon-512.webp">
<meta name="theme-color" content="#000000">
<script src="/go.js"></script>
<script>
  // Le code vient du chemin (/j/482913) ou de l'ancien format (/j?c=482913).
  DIBS.code = ((location.pathname.match(/\/j\/(\d{6})/) || [])[1]) || (/^\d{6}$/.test(DIBS.param('c')) ? DIBS.param('c') : '');
  // Bandeau natif de Safari : « Open » passe le code à l'app si elle est installée, « Get » sinon.
  document.write('<meta name="apple-itunes-app" content="app-id=6818491717' + (DIBS.code ? ', app-argument=dibs://join?code=' + DIBS.code : '') + '">');
</script>
<link rel="icon" href="/img/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  .code { background: var(--surface); border-radius: 24px; padding: 20px; margin-bottom: 20px; width: 100%; }
  .code .label { color: var(--text2); font-weight: 800; font-size: 13px; letter-spacing: 0.08em; }
  .code .digits { font-weight: 900; font-size: clamp(40px, 13vw, 52px); letter-spacing: 0.12em; margin: 4px 0 12px; font-variant-numeric: tabular-nums; }
  .ghost { background: var(--surface2); color: var(--text); border: 0; font-family: inherit; cursor: pointer; height: 44px; padding: 0 20px; border-radius: 22px; font-weight: 800; font-size: 15px; }
  .actions { display: grid; gap: 12px; width: 100%; }
  .actions .pill { width: 100%; border: 0; font-family: inherit; cursor: pointer; }
  .open { color: var(--text2); font-weight: 700; font-size: 15px; margin-top: 18px; }
  .steps-small { color: var(--text2); font-size: 15px; margin-top: 20px; line-height: 1.6; }
</style>
</head>
<body>
<header class="wrap top">
  <a class="brand" href="/"><img src="/img/icon-192.png" alt="">Dibs</a>
</header>
<main class="center">
  <div class="avatars-row" aria-hidden="true">
    <img class="y" src="/img/lapin.webp" alt=""><img class="v" src="/img/renard.webp" alt=""><img class="p" src="/img/dino.webp" alt="">
  </div>
  <h1>You're invited</h1>
  <p class="lead" id="lead">Join the game on Dibs with this code.</p>

  <div class="code" id="code-box">
    <div class="label">GAME CODE</div>
    <div class="digits" id="digits">------</div>
    <button class="ghost" id="copy" type="button">Copy code</button>
  </div>

  <div class="actions" id="actions">
    <button class="pill" id="get" type="button">Get Dibs and join</button>
  </div>
  <a class="open" id="open" href="dibs://join">I already have Dibs</a>
  <p class="steps-small" id="steps">The code is copied for you. Once Dibs is installed, tap Got a code? then Paste.</p>
  <div class="qr" id="qr" hidden>
    <img src="/img/qr-app.svg" width="160" height="160" alt="QR code to get Dibs on your iPhone">
    <p>Scan to get Dibs, then enter the code above</p>
  </div>
</main>
<script>
  (function () {
    var code = DIBS.code;
    var $ = function (id) { return document.getElementById(id); };
    DIBS.track('invite_viewed', { has_code: !!code });
    if (!code) {
      $('lead').textContent = 'This invite link is missing its code. Ask your friend for the six-digit code.';
      $('code-box').hidden = true; $('open').hidden = true;
      $('steps').textContent = 'New to Dibs? Get the app, tap Got a code? and enter the code.';
    } else {
      $('digits').textContent = code;
      $('open').href = 'dibs://join?code=' + code;
    }
    var copy = function () {
      if (!code || !navigator.clipboard) return Promise.resolve(false);
      return navigator.clipboard.writeText(code).then(function () { return true; }, function () { return false; });
    };
    $('copy').addEventListener('click', function () {
      copy().then(function (ok) {
        $('copy').textContent = ok ? 'Copied' : code;
        setTimeout(function () { $('copy').textContent = 'Copy code'; }, 2000);
      });
      DIBS.track('invite_cta', { action: 'copy_code' });
    });
    $('open').addEventListener('click', function () { DIBS.track('invite_cta', { action: 'open_app' }); });
    // Le presse-papiers n'accepte l'écriture qu'au toucher : copier puis partir vers le store dans le même geste.
    $('get').addEventListener('click', function () {
      copy().then(function () { DIBS.go(DIBS.storeUrl(), 'invite_cta', { action: 'get_app', store: DIBS.storeName() }); });
    });
    if (DIBS.platform === 'android' && !DIBS.android) {
      $('actions').hidden = true; $('open').hidden = true;
      $('steps').textContent = 'Dibs is on iPhone for now. Android is coming.';
    }
    if (DIBS.platform === 'desktop') {
      $('actions').hidden = true; $('open').hidden = true; $('steps').hidden = true;
      $('qr').hidden = false;
    }
  })();
</script>
</body>
</html>
